      The healthy control. Four buyer contacts engaged across channels, CTO involved,
      multi-threaded on both sides: Jordan runs the deal, Sam owns the technical
      threads with the eng lead, Ava has met the CTO. Positive sentiment, rising
      momentum. Nothing to flag; the baseline every other deal is compared against.
    cast:
      - {id: marcus, name: Marcus Webb, title: CTO, email: mwebb@acmeind.com, in_crm: true}
      - {id: dana, name: Dana Whitfield, title: Director of Operations, email: dwhitfield@acmeind.com, in_crm: true}
      - {id: leo, name: Leo Nakamura, title: Engineering Lead, email: lnakamura@acmeind.com, in_crm: true}
      - {id: ines, name: Ines Farah, title: Procurement Manager, email: ifarah@acmeind.com, in_crm: true}
    beats:
      - {date: 2026-02-16, stream: zoom, note: "Discovery call: Jordan + Dana + Leo; Dana frames ops pain, Leo asks integration questions"}
      - {date: 2026-02-25, stream: zoom, note: "Demo: Marcus (CTO) joins; positive reaction, asks about rollout timeline"}
      - {date: 2026-03-04, stream: slack, note: "Slack Connect opens; Leo and Sam start technical thread on API limits"}
      - {date: 2026-03-13, stream: zoom, note: "Technical deep dive: Sam + Leo; sandbox agreed"}
      - {date: 2026-03-20, stream: gmail, note: "Ines starts procurement thread; standard terms, no friction"}
      - {date: 2026-03-27, stream: zoom, note: "Exec sync: Ava + Marcus align on rollout and pricing shape"}
      - {date: 2026-04-03, stream: slack, note: "Leo confirms sandbox success; Dana asks for proposal by mid-April"}

  globex:
    name: Globex
    domain: globex.com
    amount: 120000
    stage: Negotiation
    close_date: 2026-04-30
    story: >
      The flagship. CFO Rhea engages early and asks for an ROI breakdown; Jordan
      promises it "this week" and never sends it; Rhea goes silent after Mar 26
      (12 days by demo day). Champion Omar stays active and rising on Slack, and
      mentions VP eng Priya twice, but she never appears in any channel. An email
      mentions an unnamed "security team" that must review before signature.
      Rhea is absent from Salesforce contacts despite being the economic buyer.
    cast:
      - {id: rhea, name: Rhea Kim, title: CFO, email: rhea@globex.com, in_crm: false}
      - {id: omar, name: Omar Diaz, title: Director of IT, email: odiaz@globex.com, in_crm: true}
      - {id: nina, name: Nina Park, title: Business Analyst, email: npark@globex.com, in_crm: true}
    ghosts:
      - {name: Priya Shah, title: VP Engineering, mentioned_by: omar, times: 2}
      - {name: null, label: security team, mentioned_in: gmail}
    beats:
      - {date: 2026-02-12, stream: zoom, note: "Discovery: Jordan + Omar; strong fit, Omar becomes champion"}
      - {date: 2026-03-12, stream: zoom, note: "Platform demo: Rhea joins, asks for total cost at 500 seats; Jordan promises ROI breakdown; Omar first mentions Priya's team wanting to see SSO"}
      - {date: 2026-03-18, stream: gmail, note: "Nina cc'd on pricing thread, never replies directly"}
      - {date: 2026-03-20, stream: gmail, note: "Rhea emails asking for the ROI breakdown before renewal planning; Jordan replies promising it this week"}
      - {date: 2026-03-25, stream: slack, note: "Omar: sandbox up; notes 'Rhea K. still waiting on that ROI doc'"}
      - {date: 2026-03-26, stream: gmail, note: "Jordan sends pricing one-pager, no ROI breakdown attached; Rhea never replies again"}
      - {date: 2026-03-31, stream: gmail, note: "Omar email mentions 'our security team' must review before signature; no names"}
      - {date: 2026-04-04, stream: slack, note: "Omar pushing internally for a decision this month; second Priya mention, wants technical review"}
      - {date: 2026-04-06, stream: zoom, note: "Working session: Sam + Omar + Nina; sandbox confirmed, next step security questionnaire; Nina asks one question about export formats"}

